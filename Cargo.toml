[package]
name = "rp2040_multicore"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-usb = "0.6"
embassy-usb-logger = "0.6"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }
log = "0.4"

[profile.release]
debug = 2
lto = true
opt-level = "s"
